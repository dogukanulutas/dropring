name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg poppler-utils ghostscript libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install PySide6 pyflakes
      - name: Lint
        run: python -m pyflakes dropring tests
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
