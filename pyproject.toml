[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dropring"
dynamic = ["version"]
description = "Drag files onto a ring of formats to convert them. A Linux file converter inspired by Filee."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Dogukan" }]
keywords = ["converter", "file-converter", "ffmpeg", "imagemagick", "libreoffice", "kde", "dolphin", "linux"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
dropring = "dropring.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dropring.__version__" }

[tool.setuptools.packages.find]
include = ["dropring*"]

[tool.setuptools.package-data]
dropring = ["locale/*.json"]
